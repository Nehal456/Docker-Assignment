services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    networks:
      - my-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKENDURL=http://backend:5000
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
