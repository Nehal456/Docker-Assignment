<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>
    <h1>Submit Your Info</h1>
    <form id="myForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <button type="submit">Submit</button>   <!-- This was missing -->
    </form> 
    <div id="result"></div>

    <script>
        document.getElementById('myForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            const response = await fetch('/submit-form', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }, // Fixed: 'application/json'
                body: JSON.stringify({ name, email })
            });
            const data = await response.json();
            // Fixed: backticks for template literal
            document.getElementById('result').innerHTML = `<h3>${data.message}</h3>`;
        });
    </script>
</body>
</html>
